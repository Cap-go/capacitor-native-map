appId: app.capgo.nativemap
name: Engine disabled embedded map
---
- launchApp
- tapOn:
    text: "Embedded demo"
    optional: true
- assertVisible:
    id: "engine-toggle"
- assertNotChecked:
    id: "engine-toggle"
- extendedWaitUntil:
    visible:
      text: "Map ready"
    timeout: 60000
- copyTextFrom:
    id: "map-status"
- assertTrue: ${maestro.copiedText.includes('Map ready')}