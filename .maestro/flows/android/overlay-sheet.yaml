appId: app.capgo.nativemap
name: Android overlay HUD and sheet
---
- launchApp
- extendedWaitUntil:
    visible:
      text: ".*Overlay map ready.*"
    timeout: 120000
- tapOn:
    text: "HUD button"
- assertVisible:
    text: "Recentering..."
- tapOn:
    text: "Open sheet"
- assertVisible:
    text: "Web sheet over map"
- tapOn:
    text: "Close sheet"