appId: app.capgo.nativemap
name: Engine enabled overlay map
---
- launchApp
- assertVisible:
    text: "Native map behind HTML"
- extendedWaitUntil:
    visible:
      text: ".*Overlay map ready.*"
    timeout: 60000
- copyTextFrom:
    id: "map-status"
- assertTrue: ${maestro.copiedText.includes('Overlay map ready')}